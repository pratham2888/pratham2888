<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc"><title id="title">Pratham Bhanushali. Code with purpose.</title><desc id="desc">Engineering, product, and data. An amber orbital system on a graphite background.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d131a"/><stop offset="1" stop-color="#070a0f"/></linearGradient><radialGradient id="halo"><stop stop-color="#e8ad6220"/><stop offset="1" stop-color="#e8ad6200"/></radialGradient><linearGradient id="metal"><stop stop-color="#728c9e"/><stop offset=".45" stop-color="#e3ebeb"/><stop offset=".7" stop-color="#526977"/><stop offset="1" stop-color="#b1c6cd"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8aa5b0" stroke-opacity=".055"/></pattern></defs><rect width="1440" height="480" rx="16" fill="url(#bg)"/><rect width="1440" height="480" rx="16" fill="url(#grid)"/><rect x="1" y="1" width="1438" height="478" rx="16" fill="none" stroke="#28323b"/><circle cx="1140" cy="240" r="240" fill="url(#halo)"/><g font-family="monospace" font-size="13" letter-spacing="2"><circle cx="60" cy="49" r="4" fill="#efbc79"/><text x="76" y="54" fill="#9baab5">PRATHAM / ENGINEERING · PRODUCT · DATA</text><text x="1320" y="54" text-anchor="end" fill="#6c818d">NYC / NYU</text></g><text x="58" y="147" fill="#f0f1eb" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="700" letter-spacing="-3">PRATHAM</text><text x="58" y="221" fill="#f0f1eb" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="700" letter-spacing="-3">BHANUSHALI<tspan fill="#efbc79">.</tspan></text><text x="60" y="283" fill="#efbc79" font-family="Arial,Helvetica,sans-serif" font-size="30" letter-spacing="-1">Built with code. Guided by good questions.</text><text x="60" y="320" fill="#9aa9b4" font-family="Arial,Helvetica,sans-serif" font-size="19">Engineering depth. Product thinking. Measurable outcomes.</text><path d="M60 361H820" stroke="#2c3740"/><g font-family="monospace" font-size="12" letter-spacing="1.7"><text x="60" y="398" fill="#d1dbdf">01 / UNDERSTAND</text><text x="310" y="398" fill="#d1dbdf">02 / ENGINEER</text><text x="545" y="398" fill="#d1dbdf">03 / ITERATE</text><text x="60" y="445" fill="#6c818d" font-size="10">EXPLORE THE WORK ↓</text></g><g transform="translate(1130 245)"><circle r="174" fill="none" stroke="#273641" stroke-dasharray="2 12"/><ellipse rx="180" ry="70" transform="rotate(-30)" fill="none" stroke="url(#metal)" stroke-width="4"/><ellipse rx="180" ry="70" transform="rotate(45)" fill="none" stroke="#efbc79" stroke-width="2"/><ellipse rx="180" ry="70" transform="rotate(95)" fill="none" stroke="#6f96aa" stroke-width="2"/><path d="M0-57 51-27 51 32 0 61-51 32-51-27Z" fill="#16232e" stroke="#a9c2cd" stroke-width="1.5"/><path d="m0-57 0 59m-51-29 51 29 51-29M0 2v59" fill="none" stroke="#a9c2cd" stroke-opacity=".6"/><text x="0" y="12" text-anchor="middle" fill="#e7eee8" font-family="Arial,sans-serif" font-size="27" font-weight="700">pb.</text><g><circle cx="174" r="6" fill="#efbc79"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></g></g><text x="1130" y="453" text-anchor="middle" fill="#7d95a3" font-family="monospace" font-size="11" letter-spacing="2">THE CONNECTED BUILDER</text></svg>
